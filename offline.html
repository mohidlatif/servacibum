<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123f2b">
  <title>ServaCibum · Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f8;color:#173528;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(520px,100%);background:#fff;border:1px solid #dfe7e1;border-radius:20px;padding:28px;box-shadow:0 10px 28px rgba(20,52,40,.07);text-align:center}
    img{width:86px;height:86px;border-radius:20px;margin-bottom:16px}
    h1{margin:0 0 10px;font-size:28px;color:#123f2b}
    p{margin:0 0 20px;color:#617168;line-height:1.55}
    button{border:0;border-radius:10px;padding:12px 18px;background:#158447;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="ServaCibum">
    <h1>You’re offline.</h1>
    <p>ServaCibum needs an internet connection for live donations, requests, volunteer pickups, and account activity.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
